version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SESSION_SECRET=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:///astrology_app.db
      - FLASK_ENV=development
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./astrology_app.db:/app/astrology_app.db
    restart: unless-stopped

