[project]
name = "astrology-fingerprint-app"
version = "1.0.0"
description = "A Flask app to collect client details and fingerprints for astrology."
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.0",
    "Flask-SQLAlchemy>=2.5",
    "Flask-WTF>=1.0",
    "WTForms>=3.0",
    "Pillow>=9.0",
    "reportlab>=3.6",
    "Werkzeug>=2.0",
    "psycopg2-binary", # Optional, for PostgreSQL support
]
